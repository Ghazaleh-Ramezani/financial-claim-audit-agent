apiVersion: v1
kind: Pod
metadata:
  name: {{ include "claim-audit.fullname" . }}-test-ready
  labels:
    {{- include "claim-audit.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - |
          import json, urllib.request
          base = "http://{{ include "claim-audit.fullname" . }}:{{ .Values.service.port }}"
          ready = json.load(urllib.request.urlopen(base + "/ready"))
          assert ready["ready"] is True, ready
          req = urllib.request.Request(base + "/ask", method="POST",
              data=json.dumps({"question": "What is the current ACME FY2025 revenue?",
                               "answer_mode": "rendered", "include_trace": False}).encode(),
              headers={"content-type": "application/json"})
          answer = json.load(urllib.request.urlopen(req))
          assert "115 million" in answer["answer"], answer
          print("helm test passed")
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
