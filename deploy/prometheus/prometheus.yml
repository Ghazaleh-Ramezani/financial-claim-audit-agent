# Minimal scrape configuration: one target per API replica (one uvicorn worker each).
global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: claim-audit-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  # Kafka ingestion consumer (docker compose --profile streaming); down unless that profile runs.
  - job_name: claim-audit-ingest
    static_configs:
      - targets: ["ingest-consumer:9102"]
