services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims   # local demo only
      POSTGRES_DB: claims
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://claims:claims@db:5432/claims
      PLANNER: ${PLANNER:-rule}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"

  # Optional: docker compose --profile monitoring up  (scrapes /metrics, evaluates the alert rules)
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    depends_on: [api]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  # Optional: docker compose --profile graph up   (knowledge graph in Neo4j; browser on :7474)
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/claims-graph   # local demo only
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p claims-graph 'RETURN 1'"]
      interval: 5s
      retries: 30

  graph-sync:
    build: .
    profiles: ["graph"]
    depends_on:
      neo4j:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://claims:claims@db:5432/claims
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: claims-graph
    entrypoint: ["python", "-m", "app.graph", "sync"]

  # Optional: docker compose --profile streaming up   (Kafka ingestion; consumer metrics on :9102)
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["streaming"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null"]
      interval: 5s
      retries: 30

  ingest-consumer:
    build: .
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://claims:claims@db:5432/claims
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    entrypoint: ["python", "-m", "app.stream", "consume", "--metrics-port", "9102"]
    ports:
      - "9102:9102"

volumes:
  pgdata:
